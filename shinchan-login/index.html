<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>蜡笔小新 · 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#fff3c4; --cream2:#ffe08a;
    --red:#ff5a5a; --blue:#4d9bff; --yellow:#ffd24d;
    --ink:#2b2b2b; --green:#7ed957;
    --font-fun:"ZCOOL KuaiLe","站酷快乐体","PingFang SC","Microsoft YaHei",sans-serif;
    --font-hand:"Ma Shan Zheng","ZCOOL KuaiLe",cursive;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font-fun);
    background:
      radial-gradient(circle at 12% 18%, rgba(255,210,77,.35) 0 120px, transparent 121px),
      radial-gradient(circle at 88% 78%, rgba(77,155,255,.30) 0 150px, transparent 151px),
      radial-gradient(circle at 70% 12%, rgba(255,90,90,.22) 0 110px, transparent 111px),
      var(--cream);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
    position:relative; overflow-x:hidden;
  }
  /* 蜡笔纸纹 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 1px, transparent 1px 5px);
  }

  .stage{ width:min(440px,100%); position:relative; z-index:2; }

  /* 小新涂鸦 */
  .doodle{ position:absolute; font-family:var(--font-hand); color:var(--ink); opacity:.85; user-select:none; }
  .d1{ top:-46px; right:-6px; font-size:20px; transform:rotate(8deg); }
  .d2{ top:38%; left:-58px; font-size:18px; transform:rotate(-12deg); color:var(--red); }
  .d3{ bottom:-30px; right:10px; font-size:18px; transform:rotate(6deg); color:var(--blue); }

  /* 漫画面板 */
  .panel{
    background:#fffdf5;
    border:4px solid var(--ink);
    border-radius:255px 18px 235px 18px/18px 235px 18px 255px;
    box-shadow:10px 12px 0 rgba(43,43,43,.9);
    padding:30px 28px 26px;
    position:relative;
  }
  .panel::after{ /* 内描边虚线感 */
    content:""; position:absolute; inset:7px; border:2px dashed rgba(43,43,43,.25);
    border-radius:230px 14px 215px 14px/14px 215px 14px 230px; pointer-events:none;
  }

  .mascot{ display:flex; justify-content:center; margin-bottom:6px; }
  .mascot svg{ width:118px; height:118px; }

  h1{ text-align:center; font-family:var(--font-fun); font-size:30px; color:var(--red);
      text-shadow:2px 2px 0 #fff, 4px 4px 0 rgba(43,43,43,.18); margin-bottom:2px; }
  .sub{ text-align:center; font-size:14px; color:#6b5b2e; margin-bottom:20px; }

  .field{ margin-bottom:15px; position:relative; }
  .field label{ display:block; font-size:15px; margin-bottom:6px; padding-left:4px; }
  .field input{
    width:100%; font-family:var(--font-fun); font-size:16px; color:var(--ink);
    background:#fffef8; border:3px solid var(--ink); border-radius:14px 40px 14px 40px/40px 14px 40px 14px;
    padding:11px 14px; outline:none; transition:box-shadow .15s, transform .15s;
  }
  .field input:focus{ box-shadow:4px 4px 0 var(--blue); transform:translate(-1px,-1px); }
  .toggle-pw{ position:absolute; right:14px; top:38px; cursor:pointer; font-size:18px; user-select:none; }

  .row{ display:flex; align-items:center; justify-content:space-between; margin:6px 2px 18px; font-size:14px; }
  .chk{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .chk input{ width:16px; height:16px; accent-color:var(--red); }
  .row a{ color:var(--blue); text-decoration:underline wavy; }

  .btn-login{
    width:100%; font-family:var(--font-fun); font-size:20px; color:#fff; cursor:pointer;
    background:var(--red); border:3px solid var(--ink); border-radius:40px 14px 40px 14px/14px 40px 14px 40px;
    padding:12px; box-shadow:5px 6px 0 rgba(43,43,43,.9); transition:transform .12s, box-shadow .12s;
  }
  .btn-login:hover{ transform:translate(-2px,-2px); box-shadow:8px 9px 0 rgba(43,43,43,.9); }
  .btn-login:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 rgba(43,43,43,.9); }

  .alt{ text-align:center; margin-top:16px; font-size:14px; }
  .alt a{ color:var(--red); font-weight:700; }

  /* 错误抖动 */
  @keyframes shake{ 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
  .shake{ animation:shake .4s; }

  .msg{ text-align:center; margin-top:12px; font-size:14px; min-height:18px; color:var(--red); }

  /* 彩纸 */
  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
  .confetti i{ position:absolute; width:10px; height:14px; top:-20px; opacity:.9; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); opacity:.2; } }
</style>
</head>
<body>
  <div class="confetti" id="confetti"></div>

  <div class="stage">
    <div class="doodle d1">野原家出品 🖍️</div>
    <div class="doodle d2">动感光波～</div>
    <div class="doodle d3">ビ〜</div>

    <div class="panel" id="panel">
      <div class="mascot">
        <!-- 简笔小新头像 -->
        <svg viewBox="0 0 120 120" aria-label="蜡笔小新">
          <ellipse cx="60" cy="64" rx="44" ry="42" fill="#ffe0b2" stroke="#2b2b2b" stroke-width="4"/>
          <!-- 头发小揪 -->
          <path d="M54 24 q6 -14 14 -2" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
          <!-- 眉毛(没有，省略) 眼睛 -->
          <circle cx="46" cy="60" r="4.5" fill="#2b2b2b"/>
          <circle cx="74" cy="60" r="4.5" fill="#2b2b2b"/>
          <!-- 腮红 -->
          <circle cx="36" cy="74" r="6" fill="#ff9a9a" opacity=".7"/>
          <circle cx="84" cy="74" r="6" fill="#ff9a9a" opacity=".7"/>
          <!-- 招牌嘴 -->
          <path d="M48 82 q12 12 24 0" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
          <!-- 红衬衫领 -->
          <path d="M40 104 q20 16 40 0 l0 8 q-20 14 -40 0 z" fill="#ff5a5a" stroke="#2b2b2b" stroke-width="4"/>
        </svg>
      </div>

      <h1>蜡笔小新登录</h1>
      <p class="sub">嘿！先登录才能看动感超人哦～</p>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="user">👦 名字 / 邮箱</label>
          <input id="user" type="text" placeholder="野原新之助" />
        </div>
        <div class="field">
          <label for="pwd">🔑 密码</label>
          <input id="pwd" type="password" placeholder="••••••" />
          <span class="toggle-pw" id="togglePw">👁️</span>
        </div>
        <div class="row">
          <label class="chk"><input type="checkbox" id="remember" /> 记住我</label>
          <a href="#" onclick="return false">忘记密码？</a>
        </div>
        <button class="btn-login" type="submit">登 录 ！</button>
        <div class="msg" id="msg"></div>
      </form>

      <p class="alt">还没有账号？ <a href="#" onclick="return false">马上注册 🖍️</a></p>
    </div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const panel = document.getElementById('panel');
  const msg = document.getElementById('msg');
  const user = document.getElementById('user');
  const pwd = document.getElementById('pwd');
  const togglePw = document.getElementById('togglePw');

  togglePw.onclick = () => {
    const t = pwd.type === 'password' ? 'text' : 'password';
    pwd.type = t; togglePw.textContent = t === 'password' ? '👁️' : '🙈';
  };

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!user.value.trim() || !pwd.value.trim()) {
      msg.textContent = '名字和密码都要写哦！不然小新不让你进～';
      panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake');
      return;
    }
    msg.style.color = 'var(--green)';
    msg.textContent = '登录成功！冲鸭～ 🎉';
    burst();
  });

  function burst(){
    const box = document.getElementById('confetti');
    const colors = ['#ff5a5a','#4d9bff','#ffd24d','#7ed957','#ff9a9a'];
    for (let i=0;i<40;i++){
      const c = document.createElement('i');
      c.style.left = Math.random()*100+'vw';
      c.style.background = colors[i%colors.length];
      c.style.animationDuration = (1.6+Math.random()*1.4)+'s';
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      box.appendChild(c);
      setTimeout(()=>c.remove(), 3200);
    }
  }
</script>
</body>
</html>
